name: Build TaskPulse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure preinstalled Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore app/google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)
            if [ "$FIRST_CHAR" = "{" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "::error::Missing app/google-services.json! Please add the GOOGLE_SERVICES_JSON secret in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Decoded project debug.keystore from debug.keystore.base64"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Decoded project debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
          else
            echo "::warning::debug.keystore.base64 is missing! Google Sign-In will fail unless you upload debug.keystore.base64 from AI Studio or register this fallback SHA-1 in Firebase Console."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TaskPulse.apk

      - name: Upload TaskPulse APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPulse-APK
          path: app/build/outputs/apk/debug/TaskPulse.apk
          if-no-files-found: error
